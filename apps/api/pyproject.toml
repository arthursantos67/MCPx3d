[project]
name = "api"
version = "0.1.0"
description = "Validated CAD and X3D modeling API"
readme = "README.md"
authors = [
    { name = "Arthur Santos", email = "arthursantos.homeoffice@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "domain",
    "cadquery>=2.8,<3",
    "fastapi>=0.141.1",
    "mcp<2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
    "x3d-mcp",
]

[project.scripts]
api = "api:main"

[project.optional-dependencies]
cad = [
    "cadquery>=2.8,<3",
]

[tool.uv.sources]
domain = { path = "../../packages/domain/python", editable = true }
x3d-mcp = { path = "../../services/x3d-mcp/vendor", editable = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
src = ["src"]

[tool.mypy]
python_version = "3.12"
packages = ["api"]
mypy_path = "src"
strict = true
